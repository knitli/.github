#
# Caller workflow for the "teaparty" British -> American spelling fixer.
#
# Copy this file into a target repository at:
#   .github/workflows/teaparty.yml
#
# The dictionary and replacement logic live in knitli/.github; this caller
# just wires up the trigger. Runs on every push to an open PR, so a fix lands
# before `typos` (or any other spelling-gated check) ever sees the branch.
#
# Secrets are optional: without KNITLI_AGENT_CLIENT_ID/KNITLI_AGENT_PRIVATE_KEY
# the commit is pushed with the default GITHUB_TOKEN and shows up as
# `github-actions[bot]` instead of `knitli-agent[bot]`.
#
# BEFORE ENABLING: teaparty rewrites bytes in place, so list any path whose
# exact bytes are load-bearing under `exclude_paths` (see below) — vendored
# upstream specs, frozen filing snapshots, golden fixtures, deliberate-typo
# corpora. The repo's own spell-check exclusions (`_typos.toml`) are usually
# the right starting list. The workflow cannot infer these for you.

name: Teaparty

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  teaparty:
    permissions:
      contents: write
    uses: knitli/.github/.github/workflows/teaparty.yml@main
    secrets: inherit
    # Optional overrides:
    # with:
    #   dry_run: true
    #
    #   # Newline-separated ERE fragments, ADDED to the built-in exclusions.
    #   # Blank lines and `#` comments are ignored; an invalid pattern fails
    #   # the run rather than silently scanning nothing.
    #   exclude_paths: |
    #     ^docs/vendored/
    #     ^tests/.*\.golden\.json$
