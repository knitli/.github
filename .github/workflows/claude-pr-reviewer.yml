#
# Reusable Claude PR Reviewer workflow for all Knitli repositories.
#
# A reactive, persona-driven Claude agent that reviews pull requests under the
# `knitli-agent[bot]` identity — clearly distinct from human users and from
# `github-actions[bot]`. The persona ("Knitli Agent · PR Reviewer") is expressed
# through comment branding, not a separate GitHub handle.
#
# Permission model — three layers of enforcement keep this bot to "review only":
#   1. Minted App token is down-scoped to pull-requests:write, contents:read,
#      checks:read (see "Mint down-scoped app token" below).
#   2. The job's GITHUB_TOKEN is read-only (`permissions:` block).
#   3. `--allowedTools` restricts Claude to the inline-comment MCP server plus
#      `gh pr comment|diff|view` — no git, no push, no file writes.
#
# Usage in your repository (.github/workflows/claude-pr-reviewer.yml):
#   jobs:
#     review:
#       permissions:
#         contents: read
#         pull-requests: write
#         id-token: write
#       uses: knitli/.github/.github/workflows/claude-pr-reviewer.yml@main
#       secrets: inherit
#
# See examples/claude-pr-reviewer.yml for a ready-to-copy caller workflow.

name: Claude PR Reviewer

on:
  workflow_call:
    inputs:
      review_alias:
        description: 'Comment mention that triggers an on-demand review'
        required: false
        type: string
        default: '@knitli-review'
      model:
        description: 'Override the Claude model (e.g. "claude-opus-4-8"). Empty uses the action default.'
        required: false
        type: string
        default: ''
    secrets:
      KNITLI_AGENT_CLIENT_ID:
        description: 'Client ID for the knitli-agent GitHub App'
        required: true
      KNITLI_AGENT_PRIVATE_KEY:
        description: 'Private key (.pem) for the knitli-agent GitHub App'
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Org subscription OAuth token for Claude Code'
        required: true
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key; preferred over subscription OAuth when configured'
        required: false

# Layer 2: the workflow GITHUB_TOKEN stays read-only. All writes go through the
# down-scoped App token minted below, which is what makes comments post as
# knitli-agent[bot].
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  checks: read
  issues: read

jobs:
  # Fail-closed gate: refuses to start the agent when the triggering thread
  # carries an ANSI/Unicode echoback attack vector. It BLOCKS rather than
  # sanitizes, because claude-code-action reads the trigger comment and the
  # issue/PR body from the immutable webhook payload as its own TOCTOU defense,
  # so a post-trigger edit cannot change what the model sees. See the README,
  # "Agent input gating", for the full reasoning and the known gaps.
  sanitize:
    name: Scan agent inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read
    steps:
      # The diff is fetched, not checked out. `gh pr diff` returns exactly the
      # bytes the agent itself reads via `gh pr diff`, and git's diff format
      # renders binary files as "Binary files ... differ" rather than their
      # content — so there is no binary filter to get wrong and no checkout at
      # all. (Verified against knitli/marque-dev#1656: 48 changed binaries,
      # zero escape bytes in the diff. A naive NUL-byte filter over files on
      # disk let all 110 of that repo's escape-bearing binaries through.)
      #
      # A diff too large for the API makes this step exit non-zero, which fails
      # the gate closed rather than scanning a truncated diff.
      - name: Capture the pull request diff
        id: diff
        if: ${{ github.event.pull_request != null || github.event.issue.pull_request != null }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/agent-inputs"
          mkdir -p "${dest}"
          out="${dest}/pr-${PR_NUMBER}.diff"
          gh pr diff "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" >"${out}"
          echo "path=${out}" >>"${GITHUB_OUTPUT}"
          echo "Gating $(wc -c <"${out}") bytes of diff for PR #${PR_NUMBER}."

      - name: Block on ANSI/Unicode echoback vectors
        uses: knitli/strip-ansi-action@42512901e57e31b94c89cc04fea2c0fcd51d58cf
        with:
          github-token: ${{ github.token }}
          # Empty when the diff step was skipped (no PR in context), which makes
          # the action skip file processing and scan comments only.
          files: ${{ steps.diff.outputs.path }}
          clean-pr-comments: ${{ github.event.pull_request != null || github.event.issue.pull_request != null }}
          # This workflow only ever acts on pull requests, so it holds no
          # `issues` scope and must not reach for the issue endpoint.
          clean-issue-comments: false
          # The issue/PR title and body, the triggering comment body, and a review
          # body — read from the immutable webhook payload rather than re-fetched.
          # That is the same snapshot claude-code-action reads, so it is the only
          # form of this scan a post-trigger edit cannot slip past. Needs no token
          # and no scope. The comment inputs above stay: the payload carries the
          # triggering comment, not the earlier thread comments the agent also reads.
          scan-event-payload: true
          on-threat: fail
          preset: sanitize

  review:
    needs: sanitize
    timeout-minutes: 70
    continue-on-error: true
    # Reviews are quota-heavy. Queue them per caller repository so a stacked-PR
    # submission cannot exhaust the provider in one burst. The freshness gate
    # below makes superseded queued events cheap no-ops.
    concurrency:
      group: knitli-pr-reviewer-${{ github.repository }}
      queue: max
    # Auto-review on PR events; on-demand review when a comment mentions the
    # review alias on a PR (issue_comment) or on a diff line (review comment).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, inputs.review_alias)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, inputs.review_alias))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      checks: read
      issues: read
    steps:
      # Layer 1: mint an App token narrowed to exactly what a reviewer needs.
      # Contents is read-only here even though the App ceiling allows write.
      - name: Mint down-scoped app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN || github.token }}
        with:
          client-id: ${{ secrets.KNITLI_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.KNITLI_AGENT_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read
          permission-checks: read
          permission-issues: read
          permission-actions: read

      - name: Check pull request freshness
        id: freshness
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"

          current=true
          if [ "${EVENT_NAME}" = pull_request ] && [ "${EVENT_HEAD_SHA}" != "${live_head}" ]; then
            current=false
            echo "Skipping superseded review event for ${EVENT_HEAD_SHA}; current head is ${live_head}."
          fi

          echo "current=${current}" >>"${GITHUB_OUTPUT}"

      - name: Select Anthropic credential
        id: anthropic-auth
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo 'mode=api-key' >>"${GITHUB_OUTPUT}"
          else
            echo 'mode=oauth' >>"${GITHUB_OUTPUT}"
          fi

      # claude-code-action currently hides the API status behind an
      # `is_error:true` result envelope. This one-token probe logs only the HTTP
      # status and allowlisted rate-limit headers; it never logs the response
      # body or either credential.
      - name: Probe Anthropic availability
        id: anthropic-probe
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_MODE: ${{ steps.anthropic-auth.outputs.mode }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/anthropic-probe.headers"
          request="${RUNNER_TEMP}/anthropic-probe.json"
          curl_headers=(
            --header 'anthropic-version: 2023-06-01'
            --header 'content-type: application/json'
          )

          if [ "${AUTH_MODE}" = api-key ]; then
            curl_headers+=(--header "x-api-key: ${ANTHROPIC_API_KEY}")
          else
            curl_headers+=(
              --header "authorization: Bearer ${OAUTH_TOKEN}"
              --header 'anthropic-beta: oauth-2025-04-20'
            )
          fi

          jq -n \
            --arg model "${MODEL}" \
            --arg system "You are Claude Code, Anthropic's official CLI for Claude." \
            '{
            model: $model,
            max_tokens: 1,
            system: $system,
            messages: [{role: "user", content: "Reply OK."}]
          }' >"${request}"

          set +e
          status="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "${headers}" \
            --write-out '%{http_code}' \
            --request POST \
            "${curl_headers[@]}" \
            --data-binary "@${request}" \
            'https://api.anthropic.com/v1/messages')"
          curl_status=$?
          set -e

          if [ "${curl_status}" -ne 0 ]; then
            status=000
          fi

          available=false
          if [ "${status}" = 200 ]; then
            available=true
          fi

          echo "available=${available}" >>"${GITHUB_OUTPUT}"
          echo "status=${status}" >>"${GITHUB_OUTPUT}"

          {
            echo '### Anthropic provider probe'
            echo "- Credential: \`${AUTH_MODE}\`"
            echo "- HTTP status: \`${status}\`"
            if [ "${status}" = 429 ]; then
              awk -F ': *' '
                {
                  key = tolower($1)
                }
                key == "retry-after" ||
                key == "anthropic-ratelimit-unified-7d-status" ||
                key == "anthropic-ratelimit-unified-overage-status" ||
                key == "anthropic-ratelimit-unified-overage-disabled-reason" {
                  sub(/\r$/, "", $2)
                  printf "- %s: `%s`\n", key, $2
                }
              ' "${headers}"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # Layer 3: pin Claude to inline review comments + read-only gh PR commands.
      - name: Build Claude args
        id: args
        if: steps.freshness.outputs.current == 'true' && steps.anthropic-probe.outputs.available == 'true'
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          {
            echo 'value<<CLAUDE_ARGS_EOF'
            echo '--allowedTools "mcp__github_*,mcp__github_inline_comment__create_inline_comment,Bash(gh pr:*),Agent(Explore),WebFetch(domain:*),Bash(gh:*),Bash(* --help),Bash(* --version),ReadMcpResourceTool(*),SendMessage(*),Skill(*),ToolSearch(*),TaskList(*),TaskGet(*),TaskCreate(*),TaskStop(*),Grep(*),Glob(*),Read(*)"'
            if [ -n "${MODEL}" ]; then
              echo "--model ${MODEL}"
            fi
            echo 'CLAUDE_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.freshness.outputs.current == 'true' && steps.anthropic-probe.outputs.available == 'true'
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
         token: ${{ steps.app-token.outputs.token }}
         persist-credentials: false
         submodules: recursive

      - name: Claude PR review
        if: >-
          steps.freshness.outputs.current == 'true' &&
          steps.anthropic-probe.outputs.available == 'true'
        uses: anthropics/claude-code-action@f1bd27ca5b54584506e40e17884d90bdaaa1a9b3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        continue-on-error: true
        with:
          bot_id: 142185322
          bot_name: >-
            knitli-agent[bot]
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: >-
            ${{ steps.anthropic-auth.outputs.mode == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: ${{ steps.args.outputs.value }}
          additional_permissions: |
            actions: read
            contents: write
            pull-requests: write
            checks: read
            issues: read
          allowed_bots: >-
            knitli-proxy-coder[bot],dependabot[bot],copilot[bot],google-labs-jules[bot],knitli-agent[bot]
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            code-review@claude-plugins-official
            pr-review-toolkit@claude-plugins-official
            github@claude-plugins-official
          prompt: |
            /code-review REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}

            You are **Knitli Agent · PR Reviewer**, the Knitli organization's
            reactive review persona. You are distinct from human reviewers.
            Be sharp, specific, and kind.

            Hold high standards. You are the primary defense from poor quality
            implementations, stale docs, and hallucinations.

            You have access to read related checks, issues, security-events, actions.

            Review the current pull request:
            1. Run `gh pr view` and `gh pr diff` to read the change and its
               description. Only review what the diff actually changes. You may
               examine related code to understand the context of the PR.
            2. For each concrete problem, attach an inline comment on the exact
               diff line(s) with `mcp__github_inline_comment__create_inline_comment`
               (use `confirmed: true`). Prefer a suggested fix when you can give
               one. Focus on: correctness bugs, security issues, broken error
               handling, data-integrity risks, and clear violations of patterns
               already used elsewhere in the diff. Nits should be isolated to
               correcting stale docs, misleading language or field names,
               important missing information.
            3. Post exactly one summary comment with `gh pr comment`, beginning
               with this exact header line so readers know it's you:

                   ## 🧶 Knitli Agent · PR Reviewer

               Follow the header with a 1-2 sentence verdict, then a short
               bulleted list of the most important findings (or "No blocking
               issues found." when the change looks good). Keep it scannable.

            If the diff is empty or you cannot read it, say so in the summary
            comment and stop.

      # A rejected credential is a real configuration defect and stays a hard
      # failure. A provider-side availability problem (quota exhaustion,
      # unreachable API, a 5xx from Anthropic) is not a verdict on this pull
      # request, so it reports as a skipped, successful job instead of
      # painting the check red — the review will run again on the next push
      # or on-demand via the review alias comment. 403 is treated the same as
      # 401: Anthropic returns it for permission/organization-access denials,
      # which are credential-side configuration problems, not outages.
      - name: Handle Anthropic probe result
        if: steps.freshness.outputs.current == 'true' && steps.anthropic-probe.outputs.available != 'true'
        shell: bash
        continue-on-error: true
        env:
          STATUS: ${{ steps.anthropic-probe.outputs.status }}
        run: |
          set -euo pipefail

          fail=false
          case "${STATUS}" in
            401)
              fail=true
              message='Anthropic rejected the configured credential (HTTP 401). This is a configuration problem: fix the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret.'
              ;;
            403)
              fail=true
              message='Anthropic rejected the configured credential (HTTP 403). This is a configuration problem: check the credential'"'"'s permissions and organization access.'
              ;;
            429)
              message='Anthropic rejected the review because its usage quota is exhausted (HTTP 429). This is a provider capacity issue, not a defect in this pull request.'
              ;;
            000)
              message='The Anthropic availability probe could not reach the API. This looks like a transient network or provider outage, not a defect in this pull request.'
              ;;
            5[0-9][0-9])
              message="Anthropic returned a server error (HTTP ${STATUS}). This looks like a transient provider outage, not a defect in this pull request."
              ;;
            *)
              message="Anthropic is unavailable (HTTP ${STATUS})."
              ;;
          esac

          if [ "${fail}" = true ]; then
            echo "${message}" >&2
            exit 1
          fi

          {
            echo '### Review skipped'
            echo "${message}"
            echo ''
            echo 'The reviewer will run again on the next push, or on-demand via the review alias comment.'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
